<!DOCTYPE html>
<html lang="ru" data-theme="light" data-theme-pref="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f7fa">
  <meta name="description" content="Локальное распознавание лиц в браузере. Видео и фотографии обрабатываются на устройстве.">
  <title>Face AI — анализ мимики</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* Минималистичная светлая тема */
    :root,[data-theme="light"] {
      color-scheme: light;
      --bg: #f5f7fa;
      --text: #172033;
      --muted: #667085;
      --field: #fff;
      --line: #e3e7ee;
      --glass-rgb: 255,255,255;
      --glass-brd: #e3e7ee;
      --hl: transparent;
      --shadow: 0 1px 3px rgba(16,24,40,.06);
      --accent-text: var(--accent);
      --r: 12px;
    }

    html,body {
      background: #f5f7fa !important;
      color: #172033;
      transition: none;
    }

    body {
      font-family: Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
      letter-spacing: 0;
    }

    .bg,.blob,#themeSeg,.mode-card#startEmotion {
      display: none !important;
    }

    .glass,.glass:hover,.glass::before,.glass::after {
      background: #fff !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      border: 1px solid #e3e7ee !important;
      box-shadow: 0 1px 3px rgba(16,24,40,.06) !important;
    }

    .glass::before,.glass::after {
      display: none !important;
    }

    .topbar {
      border-radius: 14px !important;
      padding: 8px 14px !important;
    }

    .logo,.logo-mini {
      border-radius: 12px !important;
      background: #1769d2 !important;
      box-shadow: none !important;
    }

    .mode-card {
      border-radius: 12px !important;
      transition: border-color .15s,background .15s !important;
    }

    .mode-card:hover {
      transform: none !important;
      border-color: #1769d2 !important;
      background: #f8fbff !important;
    }

    .btn,.icon-btn {
      border-radius: 9px !important;
      box-shadow: none !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      transition: background .15s,border-color .15s,color .15s !important;
    }

    .btn:hover:not(:disabled),.icon-btn:hover {
      transform: none !important;
    }

    .btn.primary {
      background: #1769d2 !important;
      border-color: #1769d2 !important;
      box-shadow: none !important;
    }

    .btn.primary:hover:not(:disabled) {
      background: #1059b8 !important;
    }

    .stage,.camera-circle video {
      box-shadow: none !important;
    }

    .stage-label,.stage-fps,.pause-badge {
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      background: rgba(16,24,40,.78) !important;
    }

    .hero-emoji,.cal-emoji {
      display: none !important;
    }

    .screen.active {
      animation: none !important;
    }

    @media(prefers-reduced-motion:reduce) {
      *,*::before,*::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <header class="topbar glass">
    <button class="brand-btn" id="brandHome" aria-label="На главную">
      <span class="logo-mini">F</span>
      <span class="brand">face<span>.</span>ai</span>
    </button>

    <div class="pill" id="pill" data-state="idle" role="status">
      <i class="dot"></i>
      <span id="status">Готов к запуску</span>
    </div>

    <div class="top-actions">
      <button class="icon-btn" id="openSettings" title="Настройки" aria-label="Настройки">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>
        </svg>
      </button>
      <button class="icon-btn" id="openHelp" title="Горячие клавиши (?)" aria-label="Горячие клавиши">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9.5"/>
          <path d="M9.2 9.3a3 3 0 1 1 4.3 2.7c-.9.5-1.5 1-1.5 2"/>
          <path d="M12 17.3h.01"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Здесь должен находиться остальной HTML, CSS и JavaScript программы. -->
</body>
</html>
