<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Анализ мимики и распознавание лиц в браузере. Видео и фотографии не покидают устройство.">
<title>face.ai — мимика и распознавание лиц</title>
<style>
:root{--bg:#fff;--soft:#f5f7fa;--line:#e3e8ef;--text:#0f1a2b;--muted:#6a7789;--accent:#1769d2;--accent-soft:#e8f1fd;--danger:#c9342b;--r:12px;
  --font:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
h1,h2,p,ul{margin:0}ul{padding:0;list-style:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

/* Шапка */
.top{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding:0 20px;height:60px;display:flex;align-items:center;gap:28px}
.brand{font-size:19px;font-weight:800;letter-spacing:-.04em}.brand b{color:var(--accent)}
nav{display:flex;gap:2px;height:100%;flex:1;overflow-x:auto}
nav button{border:0;background:none;padding:0 14px;height:100%;color:var(--muted);font-weight:600;font-size:14px;border-bottom:2px solid transparent;white-space:nowrap}
nav button:hover{color:var(--text)}
nav button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#b6c0cf}
.dot[data-s="live"]{background:#1f9d62}.dot[data-s="busy"]{background:#d99a14}.dot[data-s="error"]{background:var(--danger)}

main{max-width:1120px;margin:0 auto;padding:28px 20px 60px}
.tab{display:none}.tab.active{display:block}
.split{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:28px;align-items:start}
h2{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:12px}
.row-h{display:flex;justify-content:space-between;align-items:center;margin-top:26px}
.row-h span{font-weight:500;font-variant-numeric:tabular-nums}
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-h h1{font-size:24px;font-weight:800;letter-spacing:-.03em}.page-h p{color:var(--muted);font-size:14px;margin-top:4px}
.card{border:1px solid var(--line);border-radius:var(--r);padding:18px}

/* Кнопки */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 15px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:13.5px;font-weight:600;transition:background .15s,border-color .15s}
.btn:hover:not(:disabled){background:var(--soft);border-color:#cfd7e3}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover:not(:disabled){background:#0f58b8;border-color:#0f58b8}
.btn.danger{color:var(--danger)}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:#b9d4f6;color:var(--accent)}
.btn.sm{padding:6px 11px;font-size:12.5px}
.link{border:0;background:none;padding:0;color:var(--accent);font-size:12.5px;font-weight:600}.link:hover{text-decoration:underline}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.hint{font-size:12.5px;color:var(--muted);margin-top:14px;line-height:1.6}

/* Сцена с камерой */
.stage{position:relative;width:100%;aspect-ratio:16/9;background:#0e1623;border-radius:var(--r);overflow:hidden}
.stage:fullscreen{border-radius:0;aspect-ratio:auto}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.mirrorable{transform:scaleX(-1)}body.nomirror .mirrorable{transform:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.empty{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:14px;background:var(--soft);color:var(--muted);font-size:14px;text-align:center;padding:20px}
.badge{position:absolute;right:10px;bottom:10px;padding:4px 10px;border-radius:99px;font-size:11.5px;font-weight:600;color:#fff;background:rgba(10,18,32,.6);font-variant-numeric:tabular-nums;pointer-events:none}
.badge.left{right:auto;left:10px}
.badge.center{right:auto;left:50%;top:10px;bottom:auto;transform:translateX(-50%)}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:30px}
.chip{display:inline-flex;gap:6px;align-items:center;padding:5px 11px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:600}
.chip small{font-weight:500;opacity:.8}
.empty-hint{font-size:13px;color:var(--muted)}
#log{display:flex;flex-direction:column;gap:8px;font-size:13px;max-height:260px;overflow:auto}
#log li{display:flex;justify-content:space-between;gap:10px}#log time{color:var(--muted);font-variant-numeric:tabular-nums}

/* Эмоции */
.cal-step{font-size:12.5px;font-weight:700;color:var(--accent)}
#calTitle{font-size:22px;font-weight:800;letter-spacing:-.03em;margin:6px 0 6px}
.muted{color:var(--muted);font-size:14px}
.prog{height:4px;background:#e9edf3;border-radius:9px;margin-top:16px;overflow:hidden}.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.cal-status{font-size:12.5px;color:var(--accent);font-weight:600;margin-top:10px;min-height:19px}
.dots{display:flex;gap:8px;margin-top:6px}.dots i{width:8px;height:8px;border-radius:50%;background:#dbe2ec}.dots i.done{background:var(--accent)}.dots i.cur{background:var(--accent);box-shadow:0 0 0 3px #cfe1f8}
.links{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px}
.hero b{display:block;font-size:30px;font-weight:800;letter-spacing:-.03em;color:var(--accent);line-height:1.15}
.hero span{display:block;font-size:12.5px;color:var(--muted);margin-top:4px}
.em{margin-top:12px}.em:first-child{margin-top:0}
.em-top{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:5px}
.em-top span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
.track{height:6px;background:#e9edf3;border-radius:9px;overflow:hidden}.track i{display:block;height:100%;width:0;background:var(--c,var(--accent));border-radius:9px;transition:width .2s}
.mrow{display:grid;grid-template-columns:96px 1fr 42px;gap:10px;align-items:center;font-size:12.5px;margin-top:12px}
.mrow output{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.pose{position:relative;height:5px;border-radius:9px;background:#e9edf3}
.pose::before{content:"";position:absolute;left:50%;top:-3px;width:1.5px;height:11px;background:#b6c0cf}
.pose i{position:absolute;top:50%;left:50%;width:13px;height:13px;margin:-6.5px 0 0 -6.5px;border-radius:50%;background:var(--accent);transition:left .1s linear}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.stat{padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.stat b{display:block;font-size:18px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}.stat small{font-size:11.5px;color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#timeline{display:block;width:100%;height:150px;border:1px solid var(--line);border-radius:var(--r)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--c)}

/* Фото */
.drop{display:grid;place-items:center;gap:6px;padding:40px 20px;border:1.5px dashed #c5cfdd;border-radius:var(--r);background:var(--soft);text-align:center;color:var(--muted);cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.drop strong{font-size:15px;color:var(--text)}.drop:hover strong,.drop.over strong{color:var(--accent)}
#photoOut{margin-top:20px}
#photoCanvas{display:block;width:100%;height:auto;border-radius:var(--r);border:1px solid var(--line)}
.faces{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.face{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r)}
.face img,.avatar{width:52px;height:52px;border-radius:50%;object-fit:cover;background:var(--soft)}
.face b{font-size:14.5px}.face small{display:block;color:var(--muted);font-size:12.5px}

/* Люди */
.people{display:flex;flex-direction:column;gap:10px}
.person{display:grid;grid-template-columns:56px 1fr auto;gap:16px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r)}
.person .avatar{width:56px;height:56px;display:grid;place-items:center;font-weight:800;font-size:20px;color:var(--accent);background:var(--accent-soft)}
.person b{font-size:15.5px}.person small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.person .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.person.pending{opacity:.7}
.blank{padding:44px 20px;text-align:center;border:1.5px dashed #c5cfdd;border-radius:var(--r);color:var(--muted)}

/* Настройки */
.settings{max-width:620px;display:flex;flex-direction:column;gap:32px}
.set-group h2{margin-bottom:4px}
.set{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:14px 0;border-bottom:1px solid var(--line)}
.set .t{font-weight:600;font-size:14px}.set .t small{display:block;font-weight:400;color:var(--muted);font-size:12.5px;margin-top:2px;max-width:340px}
.set.col{flex-direction:column;align-items:stretch;gap:10px}
.set .lbl{display:flex;justify-content:space-between;font-weight:600;font-size:14px}.set output{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
select,input[type=text],input[type=file]{padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:14px;max-width:100%}
input[type=text]{width:100%}
input[type=range]{width:100%;accent-color:var(--accent)}
.switch{position:relative;width:42px;height:24px;flex:none}
.switch input{position:absolute;inset:0;margin:0;opacity:0;cursor:pointer;z-index:1}
.switch i{position:absolute;inset:0;border-radius:99px;background:#cdd5e0;transition:background .2s}
.switch i::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch input:checked+i{background:var(--accent)}.switch input:checked+i::after{transform:translateX(18px)}
.switch input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:13.5px;padding-top:12px}
kbd{display:inline-block;min-width:24px;padding:1px 7px;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;background:var(--soft);font:600 12px var(--font);text-align:center}

/* Диалог и уведомления */
dialog{width:min(460px,calc(100% - 28px));border:1px solid var(--line);border-radius:16px;padding:0;color:var(--text);background:var(--bg)}
dialog::backdrop{background:rgba(15,26,43,.35)}
.dlg{padding:22px;display:flex;flex-direction:column;gap:14px}.dlg h1{font-size:19px;font-weight:800;letter-spacing:-.02em}
.dlg label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}
.dlg-acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs div{position:relative}.thumbs img{width:64px;height:64px;border-radius:12px;object-fit:cover;border:1px solid var(--line);display:block}
.thumbs button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:12px;lineheight:1;padding:0}
.note{font-size:12.5px;color:var(--muted);line-height:1.6}.note.err{color:var(--danger)}
.toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:50;pointer-events:none;width:min(460px,calc(100% - 24px))}
.toast{padding:11px 16px;border-radius:10px;background:var(--text);color:#fff;font-size:13.5px;font-weight:500;text-align:center;animation:in .25s both}
.toast.error{background:var(--danger)}.toast.ok{background:#17804f}
@keyframes in{from{opacity:0;transform:translateY(8px)}}

@media(max-width:900px){.split{grid-template-columns:1fr}.top-in{gap:14px}.status span{display:none}}
@media(max-width:560px){.person{grid-template-columns:48px 1fr}.person .acts{grid-column:1/-1;justify-content:flex-start}.face{grid-template-columns:48px 1fr}.face .acts{grid-column:1/-1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ───────── Телефон и планшет ───────── */
button,.btn,select,input,label{-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation}
#overlay{object-fit:contain}
.s-only,.touch{display:none}
.top{padding-top:env(safe-area-inset-top)}
.top-in,main{padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right))}
@media(pointer:coarse){
 .desk{display:none!important}.touch{display:inline}
 #keysGroup{display:none}
 .btn{min-height:44px;padding:10px 16px}.btn.sm{min-height:40px}
 .link{padding:10px 0}
 input[type=range]{height:34px}
 .switch{width:54px;height:32px}.switch i::after{width:26px;height:26px}.switch input:checked+i::after{transform:translateX(22px)}
 select,input[type=text]{min-height:44px}
 .thumbs button{width:28px;height:28px;top:-8px;right:-8px}
}
@media(max-width:900px){
 #tab-emo .split,#tab-cam .split{display:flex;flex-direction:column;gap:0}
 #tab-emo .split>div,#tab-emo .split>aside,#tab-cam .split>div,#tab-cam .split>aside{display:contents}
 .stage{max-height:62dvh}
 #estage,#stage{order:1}
 .split>div>.bar{order:2}
 #calPanel{order:3;margin-top:18px}#emoPanel{order:4;margin-top:20px}#emoHint{order:5;margin-top:16px!important}#timelineWrap{order:6}
 #tab-cam aside>*{order:3}#tab-cam .hint{order:4}
 #tab-cam aside>h2:first-child{margin-top:22px}
}
@media(max-width:900px) and (orientation:landscape){.stage{max-height:78dvh}}
@media(max-width:700px){
 .l-only{display:none}.s-only{display:inline}
 .top-in{height:54px;gap:12px;justify-content:space-between}
 .brand{flex:1}
 .status{min-width:0;font-size:12px}.status span{display:block;max-width:46vw;overflow:hidden;text-overflow:ellipsis}
 nav{position:fixed;left:0;right:0;bottom:0;z-index:20;height:calc(60px + env(safe-area-inset-bottom));padding:0 4px env(safe-area-inset-bottom);background:rgba(255,255,255,.97);border-top:1px solid var(--line);overflow:visible}
 nav button{flex:1;min-width:0;padding:0 2px;font-size:12px;height:100%;border-bottom:0;border-top:2px solid transparent}
 nav button[aria-selected="true"]{border-top-color:var(--accent)}
 main{padding-top:18px;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
 .toasts{bottom:calc(76px + env(safe-area-inset-bottom))}
 .page-h h1{font-size:21px}
 .bar .btn{flex:1 1 calc(50% - 8px)}.bar .btn.primary{flex-basis:100%}
 #calPanel .bar .btn,#calPanel .bar .btn.primary{flex:1 1 0}
 .card{padding:16px}
 .hero b{font-size:26px}
 select,input[type=text]{font-size:16px}
 .set{flex-wrap:wrap}.set .t small{max-width:none}.set>select{width:100%}
 dialog{width:calc(100% - 20px)}
 .dlg{padding:18px}.dlg-acts .btn{flex:1}
 .mrow{grid-template-columns:90px 1fr 40px}
 .drop{padding:34px 16px}
 .face .btn{white-space:normal}
 .person .acts .btn{flex:1 1 auto;white-space:normal}
}
