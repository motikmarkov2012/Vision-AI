<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Анализ мимики и распознавание лиц в браузере. Видео и фотографии не покидают устройство.">
<title>face.ai — мимика и распознавание лиц</title>
<style>
:root{--bg:#fff;--soft:#f5f7fa;--line:#e3e8ef;--text:#0f1a2b;--muted:#6a7789;--accent:#1769d2;--accent-soft:#e8f1fd;--danger:#c9342b;--r:12px;
  --font:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
h1,h2,p,ul{margin:0}ul{padding:0;list-style:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

/* Шапка */
.top{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding:0 20px;height:60px;display:flex;align-items:center;gap:28px}
.brand{font-size:19px;font-weight:800;letter-spacing:-.04em}.brand b{color:var(--accent)}
nav{display:flex;gap:2px;height:100%;flex:1;overflow-x:auto}
nav button{border:0;background:none;padding:0 14px;height:100%;color:var(--muted);font-weight:600;font-size:14px;border-bottom:2px solid transparent;white-space:nowrap}
nav button:hover{color:var(--text)}
nav button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#b6c0cf}
